<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Russian Grammar Quest | Грамотный Квест</title>
    <!-- Подключение Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #121225;
            --surface: #1a1a3a;
            --surface-light: #1f1f45;
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.38);
            --accent: #7f00ff;
            --accent-glow: rgba(127, 0, 255, 0.31);
            --success: #00f5d4;
            --success-glow: rgba(0, 245, 212, 0.38);
            --danger: #ff007f;
            --danger-glow: rgba(255, 0, 127, 0.38);
            --warning: #ffb800;
            --text: #e0e0f0;
            --text-secondary: #9898c0;
            --text-dark: #121225;
            --border: #2a2a55;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-btn: 0 4px 16px rgba(0, 0, 0, 0.45);
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --pixel-shadow: 3px 3px 0px rgba(0, 0, 0, 0.5);
            --header-bg: #1a1a3a;
            --card-bg: #1a1a3a;
            --btn-bg: #1f1f45;
        }

        /* НЕОНОВАЯ ТЕМА */
        body.theme-neon {
            --bg: #0a0a0a;
            --surface: #111118;
            --surface-light: #181825;
            --primary: #39ff14;
            --primary-glow: rgba(57, 255, 20, 0.44);
            --accent: #ff00ff;
            --accent-glow: rgba(255, 0, 255, 0.38);
            --success: #00ffcc;
            --danger: #ff3366;
            --warning: #ffe600;
            --text: #f0f0f0;
            --text-secondary: #a0a0b0;
            --border: #333355;
            --header-bg: #111118;
            --card-bg: #111118;
            --btn-bg: #181825;
        }
        body.theme-neon .option-btn:hover:not(.disabled) {
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.5);
        }
        body.theme-neon .topic-card:hover {
            box-shadow: 0 12px 40px rgba(57, 255, 20, 0.19);
        }

        /* РЕТРО-БУМАЖНАЯ ТЕМА */
        body.theme-retro-paper {
            --bg: #f5f0e8;
            --surface: #fffef9;
            --surface-light: #faf7f0;
            --primary: #8b4513;
            --primary-glow: rgba(139, 69, 19, 0.19);
            --accent: #b8860b;
            --accent-glow: rgba(184, 134, 11, 0.19);
            --success: #2e7d32;
            --danger: #b71c1c;
            --warning: #e65100;
            --text: #2c1810;
            --text-secondary: #5d4037;
            --text-dark: #2c1810;
            --border: #c4b5a0;
            --header-bg: #fffef9;
            --card-bg: #fffef9;
            --btn-bg: #faf7f0;
            --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.12);
            --shadow-btn: 0 3px 10px rgba(0, 0, 0, 0.15);
            --pixel-shadow: 3px 3px 0px rgba(0, 0, 0, 0.2);
        }
        body.theme-retro-paper .option-btn:hover:not(.disabled) {
            box-shadow: 0 0 14px rgba(139, 69, 19, 0.25);
            background: #fdf5e6;
        }
        body.theme-retro-paper .topic-card:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        /* ТЕЛЕГРАМ-ИНТЕГРИРОВАННАЯ ТЕМА */
        body.theme-telegram {
            --bg: var(--tg-theme-bg-color, #17212b);
            --surface: var(--tg-theme-secondary-bg-color, #242f3d);
            --surface-light: var(--tg-theme-header-bg-color, #202b36);
            --primary: var(--tg-theme-button-color, #2481cc);
            --primary-glow: rgba(36, 129, 204, 0.38);
            --accent: var(--tg-theme-link-color, #5288c1);
            --accent-glow: rgba(82, 136, 193, 0.31);
            --success: #31b545;
            --danger: #e53935;
            --warning: #f5a623;
            --text: var(--tg-theme-text-color, #f5f5f5);
            --text-secondary: var(--tg-theme-hint-color, #708499);
            --text-dark: var(--tg-theme-bg-color, #17212b);
            --border: rgba(112, 132, 153, 0.25);
            --header-bg: var(--tg-theme-bg-color, #17212b);
            --card-bg: var(--tg-theme-secondary-bg-color, #242f3d);
            --btn-bg: var(--tg-theme-secondary-bg-color, #242f3d);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.25);
            --shadow-btn: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font-main);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 25% 15%, rgba(0, 242, 254, 0.03) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 55%, rgba(127, 0, 255, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 40% 85%, rgba(255, 0, 127, 0.03) 0%, transparent 50%);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.4s ease, color 0.4s ease;
        }
        .app-header {
            width: 100%;
            max-width: 860px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 18px;
            background: var(--header-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
            position: sticky;
            top: 10px;
            z-index: 200;
            margin-bottom: 16px;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-logo {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 10px var(--primary-glow));
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.4px;
            line-height: 1.2;
        }
        .header-subtitle {
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .stat-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--surface-light);
            padding: 7px 12px;
            border-radius: 22px;
            font-weight: 700;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            transition: var(--transition);
            white-space: nowrap;
        }
        .stat-badge.score-badge {
            color: var(--warning);
            border-color: rgba(255, 184, 0, 0.19);
        }
        .stat-badge.streak-badge {
            color: var(--danger);
            border-color: rgba(255, 0, 127, 0.19);
            animation: pulseStreak 1s ease-in-out infinite;
        }
        .stat-badge.streak-badge.inactive {
            animation: none;
            color: var(--text-secondary);
            border-color: var(--border);
        }
        .stat-badge.coin-badge {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.19);
        }
        @keyframes pulseStreak {
            0%, 100% { box-shadow: 0 0 6px var(--danger-glow); }
            50% { box-shadow: 0 0 18px var(--danger-glow); }
        }
        .header-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .icon-btn {
            background: var(--surface-light);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.4px;
            transition: var(--transition);
            white-space: nowrap;
            min-width: 42px;
            text-align: center;
        }
        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .icon-btn:active {
            transform: scale(0.93);
        }
        .icon-btn.active-toggle {
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 10px var(--success-glow);
        }
        .main-container {
            width: 100%;
            max-width: 860px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .dash-title {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
            color: var(--text);
        }
        .dash-subtitle {
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .difficulty-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .diff-btn {
            background: var(--surface-light);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.4px;
            transition: var(--transition);
        }
        .diff-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .diff-btn.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--text-dark);
            box-shadow: 0 0 16px var(--primary-glow);
            font-weight: 800;
        }
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }
        .topic-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 14px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .topic-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(0, 242, 254, 0.18);
        }
        .topic-card:active {
            transform: scale(0.97);
        }
        .topic-card.completed {
            border-color: var(--success);
            background: rgba(0, 245, 212, 0.03);
        }
        .topic-card.completed::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 1.2rem;
            color: var(--success);
            font-weight: 900;
        }
        .topic-icon {
            font-size: 1.8rem;
        }
        .topic-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.3;
        }
        .topic-name-ru {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .topic-meta {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }
        .topic-score {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.75rem;
        }
        .btn-action {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            padding: 14px 22px;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: var(--transition);
            box-shadow: var(--shadow-btn);
            text-align: center;
            width: 100%;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(127, 0, 255, 0.4);
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        .btn-action.btn-shop {
            background: linear-gradient(135deg, #ffb800, #ff6b00);
        }
        .quiz-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: var(--surface);
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .quiz-topic-label {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.85rem;
        }
        .quiz-progress-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }
        .progress-bar-wrap {
            width: 100%;
            height: 7px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .question-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 22px 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            transition: var(--transition);
            position: relative;
        }
        .question-card.correct-flash {
            border-color: var(--success) !important;
            box-shadow: 0 0 30px var(--success-glow) !important;
        }
        .question-card.incorrect-flash {
            border-color: var(--danger) !important;
            box-shadow: 0 0 30px var(--danger-glow) !important;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .question-num {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 3px;
            line-height: 1.5;
        }
        .question-text-ru {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            font-style: italic;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--btn-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            transition: var(--transition);
            text-align: left;
            font-family: var(--font-main);
            letter-spacing: 0.3px;
            position: relative;
        }
        .option-btn:hover:not(.disabled) {
            border-color: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
            transform: translateX(3px);
        }
        .option-btn:active:not(.disabled) {
            transform: scale(0.97);
        }
        .option-btn.disabled {
            cursor: default;
            pointer-events: none;
            opacity: 0.7;
        }
        .option-btn.hidden-option {
            display: none;
        }
        .option-btn.correct-choice {
            border-color: var(--success) !important;
            background: rgba(0, 245, 212, 0.07) !important;
            box-shadow: 0 0 18px var(--success-glow) !important;
        }
        .option-btn.incorrect-choice {
            border-color: var(--danger) !important;
            background: rgba(255, 0, 127, 0.07) !important;
            box-shadow: 0 0 18px var(--danger-glow) !important;
        }
        .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .option-btn.correct-choice .option-letter {
            background: var(--success);
            color: #000;
        }
        .option-btn.incorrect-choice .option-letter {
            background: var(--danger);
            color: #fff;
        }
        .explanation-panel {
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            background: var(--surface-light);
            border-left: 4px solid var(--primary);
            animation: slideIn 0.3s ease;
            display: none;
        }
        .explanation-panel.visible {
            display: block;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .explanation-ru {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 3px;
            font-size: 0.85rem;
        }
        .explanation-en {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-style: italic;
        }
        .btn-next {
            margin-top: 10px;
            background: var(--primary);
            color: var(--text-dark);
            border: none;
            padding: 10px 22px;
            border-radius: 22px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: var(--transition);
            box-shadow: var(--shadow-btn);
            align-self: flex-end;
            display: none;
        }
        .btn-next.visible {
            display: inline-block;
        }
        .btn-next:hover {
            filter: brightness(1.2);
            box-shadow: 0 6px 22px var(--primary-glow);
        }
        .btn-next:active {
            transform: scale(0.93);
        }
        .shop-view {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .shop-title {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            color: var(--warning);
        }
        .shop-subtitle {
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-secondary);
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .shop-item {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: var(--transition);
            box-shadow: var(--shadow-card);
        }
        .shop-item:hover {
            border-color: var(--warning);
            box-shadow: 0 8px 24px rgba(255, 184, 0, 0.2);
        }
        .shop-item.owned {
            border-color: var(--success);
            background: rgba(0, 245, 212, 0.03);
        }
        .shop-item-icon {
            font-size: 2.2rem;
        }
        .shop-item-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
        }
        .shop-item-desc {
            font-size: 0.7rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .shop-item-price {
            font-weight: 700;
            color: #ffd700;
            font-size: 0.85rem;
        }
        .shop-item-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            transition: var(--transition);
        }
        .shop-item-btn:hover {
            filter: brightness(1.3);
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .shop-item-btn:active {
            transform: scale(0.93);
        }
        .shop-item-btn:disabled {
            background: #555;
            cursor: not-allowed;
            filter: none;
            box-shadow: none;
        }
        .results-view {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .results-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 22px 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            text-align: center;
        }
        .results-emoji {
            font-size: 3.5rem;
            animation: bounceIn 0.6s ease;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .results-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 6px 0;
            color: var(--text);
        }
        .results-score {
            font-size: 2.6rem;
            font-weight: 900;
            color: var(--warning);
            font-family: var(--font-mono);
        }
        .results-detail {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 3px 0;
        }
        .breakdown-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
        }
        .breakdown-title {
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text);
            font-size: 0.95rem;
        }
        .breakdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: var(--radius-xs);
            margin-bottom: 5px;
            gap: 6px;
            flex-wrap: wrap;

    <footer class="app-footer">
        Russian Grammar Quest · Грамотный Квест · 20 Topics · 200 Questions · Bilingual · A2-B2 Level
    </footer>

    <script>
        (function() {
            // ==================== TELEGRAM WEB APP ИНИЦИАЛИЗАЦИЯ ====================
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
                if (tg.enableClosingConfirmation) {
                    tg.enableClosingConfirmation();
                }
            }

            function triggerHaptic(type) {
                if (tg && tg.HapticFeedback) {
                    if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
                    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
                    else if (type === 'light') tg.HapticFeedback.impactOccurred('light');
                }
            }

            // ==================== АУДИОДВИЖОК (WEB AUDIO API) ====================
            let audioCtx = null;
            let soundEnabled = true;

            function getAudioCtx() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            }

            function playTone(freq, type, duration, startTime, volume = 0.18) {
                if (!soundEnabled) return;
                try {
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(volume, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                } catch (e) { /* Игнорировать ошибки инициализации аудио */ }
            }

            function playCorrectSound() {
                if (!soundEnabled) return;
                try {
                    const ctx = getAudioCtx();
                    const now = ctx.currentTime;
                    playTone(660, 'sine', 0.12, now, 0.2);
                    playTone(880, 'sine', 0.15, now + 0.1, 0.22);
                    playTone(1100, 'sine', 0.18, now + 0.2, 0.18);
                } catch (e) {}
            }

            function playIncorrectSound() {
                if (!soundEnabled) return;
                try {
                    const ctx = getAudioCtx();
                    const now = ctx.currentTime;
                    playTone(150, 'square', 0.3, now, 0.2);
                    playTone(120, 'sawtooth', 0.25, now + 0.08, 0.15);
                } catch (e) {}
            }

            function playShopSound() {
                if (!soundEnabled) return;
                try {
                    const ctx = getAudioCtx();
                    const now = ctx.currentTime;
                    playTone(800, 'sine', 0.1, now, 0.2);
                    playTone(1200, 'sine', 0.12, now + 0.09, 0.22);
                    playTone(1600, 'sine', 0.14, now + 0.18, 0.18);
                } catch (e) {}
            }

            function playVictorySound() {
                if (!soundEnabled) return;
                try {
                    const ctx = getAudioCtx();
                    const now = ctx.currentTime;
                    const notes = [523, 659, 784, 1047];
                    notes.forEach((freq, i) => {
                        playTone(freq, 'sine', 0.22, now + i * 0.16, 0.22);
                    });
                } catch (e) {}
            }

            // ==================== ИГРОВОЕ СОСТОЯНИЕ (STATE) ====================
            const state = {
                currentView: 'dashboard',
                currentTopicId: null,
                currentDifficulty: 'medium',
                currentQuestionIndex: 0,
                score: 0,
                streak: 0,
                maxStreak: 0,
                grammarCoins: 0,
                inventory: { fiftyFifty: 0, secondChance: 0, themeNeon: false, themeRetro: false },
                activePowerups: { secondChanceActive: false, fiftyFiftyUsedThisQuestion: false },
                answers: [],
                uiLang: 'ru',
                topicProgress: {},
                quizQuestions: [],
                quizTopicLabel: { ru: '', en: '' },
                appliedTheme: '',
                currentShuffledOptions: [] // Динамическое хранение перемешанных вариантов текущего вопроса
            };

            function loadState() {
                try {
                    const saved = localStorage.getItem('russianGrammarQuest_v2_state');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        state.topicProgress = parsed.topicProgress || {};
                        state.grammarCoins = parsed.grammarCoins || 0;
                        state.inventory = parsed.inventory || { fiftyFifty: 0, secondChance: 0, themeNeon: false, themeRetro: false };
                        state.appliedTheme = parsed.appliedTheme || '';
                    }
                } catch (e) {}
            }

            function saveState() {
                try {
                    localStorage.setItem('russianGrammarQuest_v2_state', JSON.stringify({
                        topicProgress: state.topicProgress,
                        grammarCoins: state.grammarCoins,
                        inventory: state.inventory,
                        appliedTheme: state.appliedTheme,
                    }));
                } catch (e) {}
            }

            loadState();
            // По умолчанию в TG устанавливаем тему Telegram
            if (tg && !state.appliedTheme) {
                state.appliedTheme = 'theme-telegram';
            }
            if (state.appliedTheme) {
                document.body.className = '';
                document.body.classList.add(state.appliedTheme);
            }

            // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
            function t(ruText, enText) {
                return state.uiLang === 'ru' ? ruText : enText;
            }

            function updateHeaderStats() {
                document.getElementById('scoreDisplay').textContent = state.score;
                document.getElementById('streakDisplay').textContent = state.streak;
                document.getElementById('coinDisplay').textContent = state.grammarCoins;
                const streakBadge = document.getElementById('streakBadge');
                if (state.streak >= 3) streakBadge.classList.remove('inactive');
                else streakBadge.classList.add('inactive');
                document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
                if (!soundEnabled) document.getElementById('soundToggle').classList.remove('active-toggle');
                else document.getElementById('soundToggle').classList.add('active-toggle');
            }

            function resetSession() {
                state.currentQuestionIndex = 0;
                state.answers = [];
                state.quizQuestions = [];
                state.quizTopicLabel = { ru: '', en: '' };
                state.currentTopicId = null;
                state.activePowerups = { secondChanceActive: false, fiftyFiftyUsedThisQuestion: false };
                state.streak = 0;
                state.maxStreak = 0;
            }

            // Алгоритм Фишера-Йетса для качественного перемешивания массивов
            function shuffleArray(array) {
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // ==================== БАЗА ДАННЫХ ВОПРОСОВ (20 тем × 10 вопросов = 200) ====================
            const topics = [
                {
                    id: 'noun-cases',
                    icon: '📖',
                    name: { ru: 'Падежи существительных', en: 'Noun Cases' },
                    desc: { ru: 'Родительный vs Винительный vs Предложный падежи', en: 'Genitive vs Accusative vs Prepositional' },
                    questions: [
                        { q: { ru: 'Я не вижу ___ (стол).', en: 'I do not see the ___.' }, options: ['стол', 'стола', 'столу', 'столе'], correct: 1, difficulty: 'easy', explanation: { ru: 'После отрицания используется родительный падеж: кого? чего? — стола.', en: 'Negative verbs require Genitive case: кого? чего? — стола.' } },
                        { q: { ru: 'Она мечтает о ___ (море).', en: 'She dreams of the ___.' }, options: ['морем', 'моря', 'море', 'морю'], correct: 2, difficulty: 'easy', explanation: { ru: 'Предлог "о" требует предложного падежа: о ком? о чём? — море.', en: 'Preposition "о" requires Prepositional case: о море.' } },
                        { q: { ru: 'У ___ (брат) новая машина.', en: 'My ___ has a new car.' }, options: ['брата', 'брат', 'брату', 'братом'], correct: 0, difficulty: 'easy', explanation: { ru: 'Принадлежность с предлогом "у" требует родительного падежа: у кого? — брата.', en: 'Possession with preposition "у" requires Genitive case: у брата.' } },
                        { q: { ru: 'Нет ___ (время) на пустые разговоры.', en: 'There is no ___ for small talk.' }, options: ['время', 'временем', 'времени', 'временами'], correct: 2, difficulty: 'medium', explanation: { ru: 'Слово "время" — разносклоняемое. В родительном падеже: нет чего? — времени.', en: 'The word "время" is irregular. In Genitive: нет времени.' } },
                        { q: { ru: 'Мы говорили о ___ (жизнь).', en: 'We were talking about ___.' }, options: ['жизнь', 'жизни', 'жизнью', 'жизней'], correct: 1, difficulty: 'medium', explanation: { ru: 'Существительное 3-го склонения в предложном падеже оканчивается на -и: о жизни.', en: '3rd declension feminine noun in Prepositional case ends with -и: о жизни.' } },
                        { q: { ru: 'Он добился большого ___ (успех).', en: 'He achieved great ___.' }, options: ['успеха', 'успеху', 'успехом', 'успех'], correct: 0, difficulty: 'medium', explanation: { ru: 'Глагол "добиться" управляет родительным падежом: добиться чего? — успеха.', en: 'The verb "добиться" governs Genitive case: добиться успеха.' } },
                        { q: { ru: 'Я горжусь своей ___ (дочь).', en: 'I am proud of my ___.' }, options: ['дочь', 'дочерью', 'дочери', 'дочерям'], correct: 1, difficulty: 'medium', explanation: { ru: 'Глагол "гордиться" требует творительного падежа: гордиться кем? — дочерью.', en: 'The verb "гордиться" requires Instrumental case: гордиться дочерью.' } },
                        { q: { ru: 'Среди ___ (деревья) было тихо.', en: 'It was quiet among the ___.' }, options: ['деревьев', 'деревья', 'деревьям', 'деревьями'], correct: 0, difficulty: 'hard', explanation: { ru: 'Предлог "среди" управляет родительным падежом множественного числа: деревьев.', en: 'Preposition "среди" requires Genitive plural: среди деревьев.' } },
                        { q: { ru: 'Благодаря ___ (помощь) мы справились.', en: 'Thanks to the ___, we managed.' }, options: ['помощи', 'помощь', 'помощью', 'помощей'], correct: 0, difficulty: 'hard', explanation: { ru: 'Предлог "благодаря" требует дательного падежа: кому? чему? — помощи.', en: 'Preposition "благодаря" requires Dative case: благодаря помощи.' } },
                        { q: { ru: 'Вопреки ___ (ожидания) погода улучшилась.', en: 'Contrary to ___ the weather improved.' }, options: ['ожидания', 'ожиданиям', 'ожиданий', 'ожиданиями'], correct: 1, difficulty: 'hard', explanation: { ru: 'Предлог "вопреки" всегда требует дательного падежа: ожиданиям.', en: 'Preposition "вопреки" always governs Dative case: вопреки ожиданиям.' } }
                    ]
                },
                {
                    id: 'verb-aspects',
                    icon: '⚡',
                    name: { ru: 'Виды глагола', en: 'Verb Aspects' },
                    desc: { ru: 'Совершенный и несовершенный виды глаголов', en: 'Perfective vs Imperfective' },
                    questions: [
                        { q: { ru: 'Я ___ (читать) книгу каждый вечер.', en: 'I ___ a book every evening.' }, options: ['прочитаю', 'прочитал', 'читаю', 'почитаю'], correct: 2, difficulty: 'easy', explanation: { ru: 'Регулярное повторяющееся действие требует несовершенного вида (НСВ): читаю.', en: 'Regular repeated actions require Imperfective aspect: читаю.' } },
                        { q: { ru: 'Завтра я обязательно ___ (прочитать) эту статью.', en: 'Tomorrow I will definitely ___ this article.' }, options: ['прочитаю', 'читаю', 'буду читать', 'читал'], correct: 0, difficulty: 'easy', explanation: { ru: 'Однократное действие с акцентом на результат в будущем — совершенный вид (СВ): прочитаю.', en: 'A single future action focusing on result requires Perfective aspect: прочитаю.' } },
                        { q: { ru: 'Он ___ (писать) письмо уже два часа.', en: 'He has been ___ the letter for two hours.' }, options: ['напишет', 'написал', 'попишет', 'пишет'], correct: 3, difficulty: 'easy', explanation: { ru: 'Продолжающийся в настоящий момент процесс — несовершенный вид: пишет.', en: 'An ongoing process in the present requires Imperfective aspect: пишет.' } },
                        { q: { ru: 'Я ___ (решить) все задачи до вечера.', en: 'I ___ all the tasks by evening.' }, options: ['решал', 'решил', 'решаю', 'буду решать'], correct: 1, difficulty: 'medium', explanation: { ru: 'Действие успешно завершено к определенному моменту — совершенный вид: решил.', en: 'An action completed successfully before a deadline requires Perfective: решил.' } },
                        { q: { ru: 'Когда я ___ (идти) домой, начался дождь.', en: 'When I was ___ home, it started to rain.' }, options: ['шёл', 'пошёл', 'пришёл', 'иду'], correct: 0, difficulty: 'medium', explanation: { ru: 'Фоновое длительное действие, прерванное другим — несовершенный вид: шёл.', en: 'A background ongoing action interrupted by another requires Imperfective: шёл.' } },
                        { q: { ru: 'Она ___ (купить) цветы и поставила их в вазу.', en: 'She ___ flowers and put them in a vase.' }, options: ['покупала', 'покупила', 'купила', 'купала'], correct: 2, difficulty: 'medium', explanation: { ru: 'Последовательность завершенных действий в прошлом — совершенный вид: купила.', en: 'A sequence of completed past actions requires Perfective verbs: купила.' } },
                        { q: { ru: 'Не ___ (отвлекать) меня, когда я работаю!', en: 'Do not ___ me when I am working!' }, options: ['отвлекай', 'отвлеки', 'отвлекаешь', 'отвлёк'], correct: 0, difficulty: 'medium', explanation: { ru: 'Запрет на совершение действия (после "не") обычно выражается НСВ: не отвлекай.', en: 'Prohibition with "не" is typically expressed by Imperfective imperative: не отвлекай.' } },
                        { q: { ru: 'Я ___ (писать) эту статью вчера весь день.', en: 'I ___ this article all day yesterday.' }, options: ['написал', 'писал', 'напишу', 'пописывал'], correct: 1, difficulty: 'hard', explanation: { ru: 'Акцент на длительности процесса без указания на завершенность — НСВ: писал.', en: 'Focus on duration without specifying completion requires Imperfective: писал.' } },
                        { q: { ru: 'Ему удалось ___ (решить) трудную задачу.', en: 'He managed to ___ a difficult problem.' }, options: ['решать', 'решить', 'решается', 'решил'], correct: 1, difficulty: 'hard', explanation: { ru: 'Слово "удалось" требует инфинитива совершенного вида для обозначения успеха: решить.', en: 'The modal verb "удалось" (managed to) takes a Perfective infinitive: решить.' } },
                        { q: { ru: 'Я привык ___ (вставать) рано по утрам.', en: 'I got used to ___ early in the mornings.' }, options: ['встать', 'встану', 'вставать', 'вставал'], correct: 2, difficulty: 'hard', explanation: { ru: 'Глагол "привыкнуть" обычно требует инфинитива несовершенного вида: вставать.', en: 'The verb "привыкнуть" (get used to) normally takes an Imperfective infinitive: вставать.' } }
                    ]
                },
                {
                    id: 'verbs-of-motion',
                    icon: '🚶',
                    name: { ru: 'Глаголы движения', en: 'Verbs of Motion' },
                    desc: { ru: 'Однонаправленные и разнонаправленные глаголы движения', en: 'Unidirectional vs Multidirectional' },
                    questions: [
                        { q: { ru: 'Я ___ (ходить) в школу каждый день.', en: 'I ___ to school every day.' }, options: ['иду', 'хожу', 'пойду', 'шёл'], correct: 1, difficulty: 'easy', explanation: { ru: 'Регулярное движение туда и обратно — разнонаправленный глагол: хожу.', en: 'Regular round-trip movement requires multidirectional verb: хожу.' } },
                        { q: { ru: 'Смотри! Она ___ (идти) по улице.', en: 'Look! She is ___ down the street.' }, options: ['ходит', 'пошла', 'шла', 'идёт'], correct: 3, difficulty: 'easy', explanation: { ru: 'Движение в одном направлении в конкретный момент речи — однонаправленный глагол: идёт.', en: 'Movement in a single direction at the moment of speech requires unidirectional: идёт.' } },
                        { q: { ru: 'Он ___ (ехать) на поезде в Москву завтра.', en: 'He is ___ by train to Moscow tomorrow.' }, options: ['едет', 'ездит', 'поехал', 'ехал'], correct: 0, difficulty: 'easy', explanation: { ru: 'Движение на транспорте в определенном направлении — едет.', en: 'Movement by vehicle in one direction in the future/present — едет.' } },
                        { q: { ru: 'Мой брат часто ___ (ездить) в командировки.', en: 'My brother often ___ on business trips.' }, options: ['едет', 'поедет', 'ездит', 'ехал'], correct: 2, difficulty: 'medium', explanation: { ru: 'Повторяющиеся поездки туда-обратно на транспорте — ездит.', en: 'Repeated round trips by vehicle require multidirectional verb: ездит.' } },

                {

                    desc: { ru: 'Выделение запятыми вводных слов и конструкций', en: 'Isolating parenthetical words and clauses with commas' },
                    questions: [
                        { q: { ru: '___ (Конечно), мы придём вовремя.', en: '___ we will arrive on time.' }, options: ['Конечный', 'Конечно', 'Конечные', 'Конечность'], correct: 1, difficulty: 'easy', explanation: { ru: 'Вводное слово "конечно" выражает уверенность и всегда выделяется запятой.', en: 'Parenthetical word "конечно" (of course) expresses certainty and is set off by commas.' } },
                        { q: { ru: 'К счастью, погода ___ (улучшиться).', en: 'Fortunately, the weather ___.' }, options: ['улучшилась', 'улучшиться', 'улучшилась бы', 'улучшится'], correct: 0, difficulty: 'easy', explanation: { ru: '"К счастью" — вводное выражение эмоции. Глагол согласуется в женском роде прошедшего времени: улучшилась.', en: '"К счастью" (fortunately) is a parenthetical phrase. Past feminine verb: улучшилась.' } },

                        { q: { ru: 'Мы встретимся сегодня, ___ (вероятно), вечером.', en: 'We will meet today, ___ in the evening.' }, options: ['вероятный', 'вероятность', 'вероятно', 'вероятными'], correct: 2, difficulty: 'medium', explanation: { ru: '"Вероятно" — вводное слово степени уверенности, выделяется запятыми с двух сторон в середине предложения.', en: '"Вероятно" (probably) is parenthetical and is set off by commas on both sides.' } },
                        { q: { ru: 'Он, ___ (к сожалению), не сможет прийти.', en: 'He, ___ will not be able to come.' }, options: ['к сожалению', 'к жалению', 'сожалению', 'к сожалеющему'], correct: 0, difficulty: 'medium', explanation: { ru: '"К сожалению" — вводная конструкция, выражающая чувство сожаления.', en: '"К сожалению" (unfortunately) is a standard parenthetical expression.' } },
                        { q: { ru: 'С одной стороны, это выгодно, а с ___ (другой) — рискованно.', en: 'On one hand, it is profitable, but on the ___ — risky.' }, options: ['другую', 'другой', 'другом', 'других'], correct: 1, difficulty: 'medium', explanation: { ru: 'Вводное выражение "с другой стороны" во второй части часто сокращается до "с другой" и выделяется запятой.', en: 'Parenthetical phrase "с другой стороны" (on the other hand) is often shortened and punctuated.' } },
                        { q: { ru: 'По слухам, зима будет очень ___ (холодная).', en: 'According to rumors, the winter will be very ___.' }, options: ['холодной', 'холодная', 'холодную', 'холодным'], correct: 1, difficulty: 'medium', explanation: { ru: '"По слухам" — источник сообщения. В предикативе после "будет" используется им. падеж или творительный: холодная / холодной.', en: '"По слухам" is parenthetical. "Зима будет холодная" (Nominative) is correct.' } },
                        { q: { ru: 'Он обещал прийти, ___ (однако), не пришёл.', en: 'He promised to come, ___ did not show up.' }, options: ['однако', 'однако же', 'хотя', 'но'], correct: 0, difficulty: 'hard', explanation: { ru: '"Однако" в середине предложения в роли противительного союза (равно "но") выделяется запятой только ПЕРЕД ним.', en: 'When "однако" acts as a coordinating conjunction (equals "но"), a comma is placed only before it.' } },
                        { q: { ru: 'Таким образом, мы ___ (закончить) проект.', en: 'Thus, we ___ the project.' }, options: ['закончили', 'закончили бы', 'закончить', 'заканчивали'], correct: 0, difficulty: 'hard', explanation: { ru: '"Таким образом" — вводное слово вывода (итоговое). Прошедшее время: закончили.', en: '"Таким образом" (thus) is parenthetical. Past tense: закончили.' } },
                        { q: { ru: 'Вы, ___ (кажется), удивлены этим решением.', en: 'You, ___ seem surprised by this decision.' }, options: ['кажется', 'кажущийся', 'кажется бы', 'казалось'], correct: 0, difficulty: 'hard', explanation: { ru: '"Кажется" — вводное слово неуверенности, обособляется запятыми с обеих сторон.', en: '"Кажется" (seems/apparently) is parenthetical and requires commas on both sides.' } }

            ];

            // ==================== ССЫЛКИ НА ЭЛЕМЕНТЫ DOM ====================
            const mainContainer = document.getElementById('mainContainer');
            const soundToggle = document.getElementById('soundToggle');
            const langToggle = document.getElementById('langToggle');
            const themeCycleBtn = document.getElementById('themeCycleBtn');

            // ==================== ПЕРЕКЛЮЧАТЕЛЬ ЗВУКА ====================
            soundToggle.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                triggerHaptic('light');
                updateHeaderStats();
            });

            // ==================== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА ИНТЕРФЕЙСА ====================
            langToggle.addEventListener('click', () => {
                state.uiLang = state.uiLang === 'ru' ? 'en' : 'ru';
                langToggle.textContent = state.uiLang === 'ru' ? '🌐 RU' : '🌐 EN';
                triggerHaptic('light');
                rerenderCurrentView();
            });

            // ==================== ПЕРЕКЛЮЧАТЕЛЬ ТЕМ ОФОРМЛЕНИЯ ====================
            themeCycleBtn.addEventListener('click', () => {
                const themes = ['', 'theme-neon', 'theme-retro-paper'];
                if (tg) themes.push('theme-telegram');
                const currentIdx = themes.indexOf(state.appliedTheme);
                const nextIdx = (currentIdx + 1) % themes.length;
                document.body.className = '';
                state.appliedTheme = themes[nextIdx];
                if (state.appliedTheme) document.body.classList.add(state.appliedTheme);
                triggerHaptic('light');
                saveState();
            });

            function rerenderCurrentView() {
                switch (state.currentView) {
                    case 'dashboard': renderDashboard(); break;
                    case 'quiz': renderQuizQuestion(); break;
                    case 'shop': renderShop(); break;
                    case 'results': renderResultsFromState(); break;
                    default: renderDashboard();
                }
            }

            // ==================== РЕНДЕР: ДАШБОРД ====================
            function renderDashboard() {
                state.currentView = 'dashboard';
                resetSession();
                updateHeaderStats();
                let cardsHTML = '';
                topics.forEach(topic => {
                    const progress = state.topicProgress[topic.id];
                    const completed = progress && progress.completed;
                    const bestScore = progress ? progress.bestScore : 0;
                    const totalQ = topic.questions.length;
                    const cardClass = completed ? 'topic-card completed' : 'topic-card';
                    const scoreHTML = completed ?
                        `<span class="topic-score">🏆 ${bestScore}/${totalQ * 20} ${t('очк.', 'pts')}</span>` :
                        `<span class="topic-meta">${totalQ} ${t('вопросов', 'questions')}</span>`;
                    cardsHTML += `
                <div class="${cardClass}" onclick="window._selectTopic('${topic.id}')">
                  <span class="topic-icon">${topic.icon}</span>
                  <div class="topic-name">${topic.name.ru}</div>
                  <div class="topic-name-ru">${topic.name.en}</div>
                  <div class="topic-meta">${topic.desc.ru}</div>
                  ${scoreHTML}
                </div>`;
                });
                const diffLabels = [
                    { id: 'easy', ru: '🟢 Лёгкий', en: '🟢 Easy' },
                    { id: 'medium', ru: '🟡 Средний', en: '🟡 Medium' },
                    { id: 'hard', ru: '🔴 Сложный', en: '🔴 Hard' },
                ];
                let diffHTML = '';
                diffLabels.forEach(d => {
                    const sel = state.currentDifficulty === d.id ? ' selected' : '';
                    diffHTML += `<button class="diff-btn${sel}" onclick="window._setDifficulty('${d.id}')">${t(d.ru, d.en)}</button>`;
                });
                mainContainer.innerHTML = `
              <div class="dashboard">
                <div class="dash-title">${t('📜 Выберите тему', '📜 Choose a Topic')}</div>
                <div class="dash-subtitle">${t('20 тем · 200 вопросов · Интерактивный разбор ошибок', '20 topics · 200 questions · Interactive review')}</div>
                <div class="difficulty-selector">${diffHTML}</div>
                <div class="topic-grid">${cardsHTML}</div>
                <button class="btn-action" onclick="window._startMixedChallenge()">🎲 ${t('Смешанный вызов', 'Mixed Challenge')}</button>
                <button class="btn-action btn-shop" onclick="window._openShop()">🛒 ${t('Магазин бонусов', 'Bonus Shop')}</button>
              </div>`;
            }

            window._setDifficulty = function(diff) {
                state.currentDifficulty = diff;
                triggerHaptic('light');
                renderDashboard();
            };

            // ==================== НАЧАЛО КВИЗА ====================
            function startQuiz(topicId, labelRu, labelEn, questions) {
                state.currentView = 'quiz';
                state.currentTopicId = topicId;
                state.currentQuestionIndex = 0;
                state.answers = [];
                state.quizQuestions = [...questions];
                state.quizTopicLabel = { ru: labelRu, en: labelEn };
                state.streak = 0;
                state.maxStreak = 0;
                state.activePowerups = { secondChanceActive: false, fiftyFiftyUsedThisQuestion: false };
                updateHeaderStats();
                renderQuizQuestion();
            }

            function renderQuizQuestion() {
                const idx = state.currentQuestionIndex;
                const total = state.quizQuestions.length;
                const qData = state.quizQuestions[idx];
                const progressPercent = Math.round((idx / total) * 100);
                const topicLabel = t(state.quizTopicLabel.ru, state.quizTopicLabel.en);
                const letters = ['A', 'B', 'C', 'D'];
                state.activePowerups.fiftyFiftyUsedThisQuestion = false;

                // Баг с фиксированными индексами решён: перемешивание вариантов ответов динамически с сохранением связи
                const optionsWithIndices = qData.options.map((opt, originalIdx) => ({
                    text: opt,
                    originalIdx: originalIdx
                }));
                state.currentShuffledOptions = shuffleArray(optionsWithIndices);

                let optionsHTML = '';
                state.currentShuffledOptions.forEach((opt, i) => {
                    optionsHTML += `
                <button class="option-btn" id="optBtn${i}" onclick="window._selectAnswer(${i})">
                  <span class="option-letter">${letters[i]}</span>
                  <span>${opt.text}</span>
                </button>`;
                });

                const fiftyLeft = state.inventory.fiftyFifty || 0;
                const scLeft = state.inventory.secondChance || 0;

                mainContainer.innerHTML = `
              <div class="quiz-view">
                <div class="quiz-header">
                  <span class="quiz-topic-label">${topicLabel}</span>
                  <span class="quiz-progress-text">${t('Вопрос', 'Question')} ${idx + 1} / ${total}</span>
                  <span style="font-size:0.7rem;color:var(--text-secondary);">${t('Сложность', 'Difficulty')}: ${t({easy:'Лёгкий',medium:'Средний',hard:'Сложный'}[qData.difficulty], qData.difficulty)}</span>
                </div>
                <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${progressPercent}%;"></div></div>
                <div class="question-card" id="questionCard">
                  <div class="question-num">${t('Вопрос', 'Question')} #${idx + 1}</div>
                  <div class="question-text">${qData.q.ru}</div>
                  <div class="question-text-ru">${qData.q.en}</div>
                  <div class="options-list" id="optionsList">${optionsHTML}</div>
                  <div class="explanation-panel" id="explanationPanel">
                    <div class="explanation-ru" id="explanationRu"></div>
                    <div class="explanation-en" id="explanationEn"></div>
                  </div>
                  <button class="btn-next" id="btnNext" onclick="window._goToNext()">${t('Далее →', 'Next →')}</button>
                  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;" id="powerupBar">
                    <button class="icon-btn" id="btn5050" onclick="window._useFiftyFifty()" ${fiftyLeft <= 0 ? 'disabled' : ''}>✂️ 50/50 (${fiftyLeft})</button>
                    <button class="icon-btn" id="btnSecondChance" onclick="window._useSecondChance()" ${scLeft <= 0 ? 'disabled' : ''}>🔄 ${t('Второй шанс', 'Second Chance')} (${scLeft})</button>
                  </div>
                </div>
              </div>`;
            }

            window._selectTopic = function(topicId) {
                const topic = topics.find(t => t.id === topicId);
                if (!topic) return;
                triggerHaptic('light');

                // Если при выборе сложности мало вопросов, берём все 10 вопросов темы и динамически начисляем очки
                let filtered = topic.questions.filter(q => q.difficulty === state.currentDifficulty);
                let finalQuizQuestions = [];
                if (filtered.length < 5) {
                    finalQuizQuestions = [...topic.questions]; // Адаптация: берем все вопросы темы
                } else {
                    finalQuizQuestions = [...filtered];
                }

                state.score = 0;
                updateHeaderStats();
                const shuffledQuestions = shuffleArray(finalQuizQuestions);
                startQuiz(topicId, topic.name.ru, topic.name.en, shuffledQuestions);
            };

            window._startMixedChallenge = function() {
                triggerHaptic('light');
                const allQ = [];
                topics.forEach(t => {
                    t.questions.forEach(q => {
                        if (q.difficulty === state.currentDifficulty) {
                            allQ.push({ ...q, sourceTopicId: t.id });
                        }
                    });
                });
                if (allQ.length === 0) {
                    alert(t('Нет доступных вопросов!', 'No questions available!'));
                    return;
                }
                const shuffled = shuffleArray(allQ).slice(0, 15); // Ограничиваем 15 вопросами для динамики
                state.score = 0;
                state.currentTopicId = 'mixed';
                updateHeaderStats();
                startQuiz('mixed', t('Смешанный вызов', 'Mixed Challenge'), 'Mixed Challenge', shuffled);
            };

            // ==================== ИСПОЛЬЗОВАНИЕ БОНУСОВ ====================
            window._useFiftyFifty = function() {
                if (state.inventory.fiftyFifty <= 0) return;
                if (state.activePowerups.fiftyFiftyUsedThisQuestion) return;
                triggerHaptic('light');
                state.inventory.fiftyFifty--;
                state.activePowerups.fiftyFiftyUsedThisQuestion = true;
                saveState();

                const qData = state.quizQuestions[state.currentQuestionIndex];
                const correctOriginalIdx = qData.correct;
                
                let wrongShuffledIndices = [];
                state.currentShuffledOptions.forEach((opt, idx) => {
                    if (opt.originalIdx !== correctOriginalIdx) {
                        wrongShuffledIndices.push(idx);
                    }
                });

                // Скрываем ровно 2 неправильных варианта на основе перемешанного списка
                const shuffledWrongs = shuffleArray(wrongShuffledIndices).slice(0, 2);
                shuffledWrongs.forEach(idx => {
                    const btn = document.getElementById('optBtn' + idx);
                    if (btn) btn.classList.add('hidden-option');
                });

                document.getElementById('btn5050').disabled = true;
                document.getElementById('btn5050').textContent = `✂️ 50/50 (${state.inventory.fiftyFifty})`;
                updateHeaderStats();
            };

            window._useSecondChance = function() {
                if (state.inventory.secondChance <= 0) return;
                triggerHaptic('light');
                state.inventory.secondChance--;
                state.activePowerups.secondChanceActive = true;
                saveState();
                document.getElementById('btnSecondChance').disabled = true;
                document.getElementById('btnSecondChance').textContent = `🔄 ${t('Второй шанс', 'Second Chance')} (${state.inventory.secondChance})`;
                updateHeaderStats();
            };

            // ==================== ВЫБОР ОТВЕТА ====================
            window._selectAnswer = function(shuffledChoiceIdx) {
                const idx = state.currentQuestionIndex;
                const qData = state.quizQuestions[idx];
                const selectedOption = state.currentShuffledOptions[shuffledChoiceIdx];
                const isCorrect = (selectedOption.originalIdx === qData.correct);

                const questionCard = document.getElementById('questionCard');
                const explanationPanel = document.getElementById('explanationPanel');
                const explanationRu = document.getElementById('explanationRu');
                const explanationEn = document.getElementById('explanationEn');
                const btnNext = document.getElementById('btnNext');
                const allBtns = document.querySelectorAll('.option-btn');

                allBtns.forEach(b => b.classList.add('disabled'));

                // Находим правильную кнопку в перемешанном массиве и подсвечиваем её зелёным
                state.currentShuffledOptions.forEach((opt, i) => {
                    if (opt.originalIdx === qData.correct) {
                        const correctBtn = document.getElementById('optBtn' + i);
                        if (correctBtn) correctBtn.classList.add('correct-choice');
                    }
                });

                const userBtn = document.getElementById('optBtn' + shuffledChoiceIdx);

                // Динамическое начисление очков с зависимости от сложности вопроса
                const pointsMap = { easy: 10, medium: 15, hard: 20 };
                const basePoints = pointsMap[qData.difficulty] || 15;

                if (isCorrect) {
                    triggerHaptic('success');
                    questionCard.classList.add('correct-flash');
                    state.streak++;
                    if (state.streak > state.maxStreak) state.maxStreak = state.streak;
                    
                    const multiplier = state.streak >= 3 ? 1.5 : 1.0;
                    const finalPoints = Math.round(basePoints * multiplier);
                    const coinsEarned = Math.round(finalPoints * 0.5);

                    state.score += finalPoints;
                    state.grammarCoins += coinsEarned;
                    playCorrectSound();

                    explanationRu.textContent = '✅ ' + qData.explanation.ru;
                    explanationEn.textContent = '✅ ' + qData.explanation.en;
                } else {
                    if (state.activePowerups.secondChanceActive) {
                        triggerHaptic('success');
                        state.activePowerups.secondChanceActive = false;
                        questionCard.classList.add('correct-flash');
                        state.streak++;
                        if (state.streak > state.maxStreak) state.maxStreak = state.streak;

                        const finalPoints = Math.round(basePoints * 0.8); // Небольшой штраф
                        state.score += finalPoints;
                        state.grammarCoins += 3;
                        playCorrectSound();

                        explanationRu.textContent = `🔄 ${t('Второй шанс! Ошибка прощена.', 'Second Chance! Mistake forgiven.')} ` + qData.explanation.ru;
                        explanationEn.textContent = `🔄 ${t('Второй шанс! Ошибка прощена.', 'Second Chance! Mistake forgiven.')} ` + qData.explanation.en;
                    } else {
                        triggerHaptic('error');
                        if (userBtn) userBtn.classList.add('incorrect-choice');
                        questionCard.classList.add('incorrect-flash');
                        state.streak = 0;
                        playIncorrectSound();

                        explanationRu.textContent = '❌ ' + qData.explanation.ru;
                        explanationEn.textContent = '❌ ' + qData.explanation.en;
                    }
                }

                explanationPanel.classList.add('visible');
                btnNext.classList.add('visible');
                state.answers.push({
                    topicId: state.currentTopicId,
                    questionIndex: idx,
                    userChoice: selectedOption.originalIdx,
                    correct: isCorrect,
                    qData
                });
                saveState();
                updateHeaderStats();

                const powerupBar = document.getElementById('powerupBar');
                if (powerupBar) powerupBar.style.display = 'none';
            };

            // ==================== СЛЕДУЮЩИЙ ВОПРОС ====================
            window._goToNext = function() {
                const idx = state.currentQuestionIndex;
                const total = state.quizQuestions.length;
                if (idx + 1 < total) {
                    state.currentQuestionIndex++;
                    state.activePowerups.fiftyFiftyUsedThisQuestion = false;
                    renderQuizQuestion();
                    const card = document.getElementById('questionCard');
                    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    finishQuiz();
                }
            };

            // ==================== ЗАВЕРШЕНИЕ КВИЗА ====================
            function finishQuiz() {
                state.currentView = 'results';
                const totalQ = state.quizQuestions.length;
                const correctCount = state.answers.filter(a => a.correct).length;
                const percent = Math.round((correctCount / totalQ) * 100);
                const topicId = state.currentTopicId;

                if (topicId && topicId !== 'mixed') {
                    const bestScore = state.topicProgress[topicId]?.bestScore || 0;
                    state.topicProgress[topicId] = {
                        completed: percent >= 70,
                        bestScore: Math.max(bestScore, state.score),
                        totalQuestions: topics.find(t => t.id === topicId)?.questions.length || totalQ,
                    };
                }
                saveState();
                playVictorySound();
                renderResultsFromState();
            }

            function renderResultsFromState() {
                const totalQ = state.quizQuestions.length;
                const correctCount = state.answers.filter(a => a.correct).length;
                const percent = Math.round((correctCount / totalQ) * 100);
                let emoji = '🌟';
                if (percent >= 90) emoji = '🏆';
                else if (percent >= 70) emoji = '🎉';
                else if (percent >= 50) emoji = '👍';
                else emoji = '💪';

                let breakdownHTML = '';
                const perfMap = {};
                state.answers.forEach(a => {
                    let tid = a.topicId;
                    if (!tid || tid === 'mixed') {
                        for (const t of topics) {
                            if (t.questions.some(q => q.q.ru === a.qData?.q?.ru)) {
                                tid = t.id;
                                break;
                            }
                        }
                    }
                    if (tid && tid !== 'mixed') {
                        if (!perfMap[tid]) {
                            perfMap[tid] = { correct: 0, total: 0, name: { ru: tid, en: tid } };
                        }
                        perfMap[tid].correct += a.correct ? 1 : 0;
                        perfMap[tid].total += 1;
                        const tdata = topics.find(t => t.id === tid);
                        if (tdata) perfMap[tid].name = tdata.name;
                    }
                });

                for (const [tid, p] of Object.entries(perfMap)) {
                    const pct = Math.round((p.correct / p.total) * 100);
                    const cls = pct >= 70 ? 'mastered' : 'needs-work';
                    const status = pct >= 70 ? t('✅ Усвоено', '✅ Mastered') : t('⚠️ Нужна практика', '⚠️ Needs Practice');
                    breakdownHTML += `
                <div class="breakdown-item ${cls}">
                  <span class="breakdown-topic">${p.name.ru} / ${p.name.en}</span>
                  <span>${p.correct}/${p.total}</span>
                  <span class="breakdown-status ${cls}">${status}</span>
                </div>`;
                }

                const retryLabel = state.currentTopicId && state.currentTopicId !== 'mixed' ?
                    t('🔁 Повторить тему', '🔁 Retry Topic') :
                    t('🔁 Повторить вызов', '🔁 Retry Challenge');

                mainContainer.innerHTML = `
              <div class="results-view">
                <div class="results-card">
                  <div class="results-emoji">${emoji}</div>
                  <div class="results-title">${t('Квиз завершён!', 'Quiz Complete!')}</div>
                  <div class="results-score">${state.score} ${t('очк.', 'pts')}</div>
                  <div class="results-detail">${correctCount} / ${totalQ} ${t('правильно', 'correct')} (${percent}%)</div>
                  <div class="results-detail">🔥 ${t('Макс. серия:', 'Max Streak:')} ${state.maxStreak} | 🪙 ${state.grammarCoins} ${t('монет', 'coins')}</div>
                </div>
                <div class="breakdown-section">
                  <div class="breakdown-title">${t('📊 Разбор результатов', '📊 Performance Breakdown')}</div>
                  ${breakdownHTML || `<p style="font-size:0.8rem;text-align:center;color:var(--text-secondary);">${t('Анализ тем недоступен для смешанных режимов', 'Topic breakdown unavailable for full mixed mode')}</p>`}
                </div>
                <button class="btn-retry" onclick="window._retryQuiz()">${retryLabel}</button>
                <button class="btn-back" onclick="window._goToDashboard()">${t('🏠 На главную', '🏠 Dashboard')}</button>
              </div>`;
            }

            window._retryQuiz = function() {
                // Корректно уменьшаем зачисляемые баллы во избежание фарма
                state.score = Math.max(0, state.score - state.answers.filter(a => a.correct).length * 10);
                state.grammarCoins = Math.max(0, state.grammarCoins - state.answers.filter(a => a.correct).length * 5);
                state.streak = 0;
                state.maxStreak = 0;
                state.activePowerups = { secondChanceActive: false, fiftyFiftyUsedThisQuestion: false };
                updateHeaderStats();
                saveState();
                const questions = shuffleArray(state.quizQuestions);
                startQuiz(state.currentTopicId || 'mixed', state.quizTopicLabel.ru, state.quizTopicLabel.en, questions);
            };

            window._goToDashboard = function() {
                state.score = 0;
                state.streak = 0;
                state.maxStreak = 0;
                state.activePowerups = { secondChanceActive: false, fiftyFiftyUsedThisQuestion: false };
                updateHeaderStats();
                renderDashboard();
            };

            // ==================== МАГАЗИН БОНУСОВ (SHOP) ====================
            window._openShop = function() {
                state.currentView = 'shop';
                updateHeaderStats();
                renderShop();
            };

            function renderShop() {
                const shopItems = [
                    { id: 'fiftyFifty', icon: '✂️', nameRu: '50/50', nameEn: '50/50', descRu: 'Убирает два случайных неверных варианта', descEn: 'Removes two random wrong options', price: 50, owned: state.inventory.fiftyFifty, type: 'consumable' },
                    { id: 'secondChance', icon: '🔄', nameRu: 'Второй шанс', nameEn: 'Second Chance', descRu: 'След. ошибка не сбросит вашу серию ответов', descEn: 'The next mistake won\'t break your streak', price: 100, owned: state.inventory.secondChance, type: 'consumable' },
                    { id: 'themeNeon', icon: '💚', nameRu: 'Тема: Неон', nameEn: 'Theme: Neon', descRu: 'Стильный неоновый киберпанк интерфейс', descEn: 'Stylish neon cyberpunk interface', price: 150, owned: state.inventory.themeNeon, type: 'permanent' },
                    { id: 'themeRetro', icon: '📜', nameRu: 'Тема: Ретро-Бумага', nameEn: 'Theme: Retro Paper', descRu: 'Спокойный теплый бумажный дизайн', descEn: 'Calm warm paper design', price: 150, owned: state.inventory.themeRetro, type: 'permanent' },
                ];
                let itemsHTML = '';
                shopItems.forEach(item => {
                    const isOwnedPermanent = item.type === 'permanent' && item.owned;
                    const canAfford = state.grammarCoins >= item.price;
                    const disabled = isOwnedPermanent || !canAfford;
                    const btnText = isOwnedPermanent ? t('✅ Куплено', '✅ Owned') : t(`Купить (${item.price}🪙)`, `Buy (${item.price}🪙)`);
                    const ownedClass = isOwnedPermanent ? ' owned' : '';
                    itemsHTML += `
                <div class="shop-item${ownedClass}">
                  <div class="shop-item-icon">${item.icon}</div>
                  <div class="shop-item-name">${t(item.nameRu, item.nameEn)}</div>
                  <div class="shop-item-desc">${t(item.descRu, item.descEn)}</div>
                  <div class="shop-item-price">${item.price} 🪙</div>
                  <button class="shop-item-btn" onclick="window._buyItem('${item.id}')" ${disabled ? 'disabled' : ''}>${btnText}</button>
                </div>`;
                });
                mainContainer.innerHTML = `
              <div class="shop-view">
                <div class="shop-title">🛒 ${t('Магазин бонусов', 'Bonus Shop')}</div>
                <div class="shop-subtitle">${t('Тратьте монеты, заработанные за правильные ответы, на улучшение игры', 'Spend coins earned from correct answers on upgrades')}</div>
                <div class="shop-grid">${itemsHTML}</div>
                <button class="btn-back" onclick="window._goToDashboard()">${t('🏠 На главную', '🏠 Dashboard')}</button>
              </div>`;
            }

            window._buyItem = function(itemId) {
                const prices = { fiftyFifty: 50, secondChance: 100, themeNeon: 150, themeRetro: 150 };
                const price = prices[itemId];
                if (!price || state.grammarCoins < price) return;

                if (itemId === 'fiftyFifty') {
                    if (state.inventory.fiftyFifty >= 99) return;
                    state.grammarCoins -= price;
                    state.inventory.fiftyFifty++;
                } else if (itemId === 'secondChance') {
                    if (state.inventory.secondChance >= 99) return;
                    state.grammarCoins -= price;
                    state.inventory.secondChance++;
                } else if (itemId === 'themeNeon') {
                    if (state.inventory.themeNeon) return;
                    state.grammarCoins -= price;
                    state.inventory.themeNeon = true;
                } else if (itemId === 'themeRetro') {
                    if (state.inventory.themeRetro) return;
                    state.grammarCoins -= price;
                    state.inventory.themeRetro = true;
                }
                triggerHaptic('success');
                playShopSound();
                saveState();
                updateHeaderStats();
                renderShop();

                if (itemId === 'themeNeon' && state.inventory.themeNeon) {
                    document.body.className = '';
                    document.body.classList.add('theme-neon');
                    state.appliedTheme = 'theme-neon';
                    saveState();
                }
                if (itemId === 'themeRetro' && state.inventory.themeRetro) {
                    document.body.className = '';
                    document.body.classList.add('theme-retro-paper');
                    state.appliedTheme = 'theme-retro-paper';
                    saveState();
                }
            };

            // ==================== ИНИЦИАЛИЗАЦИЯ ====================
            function init() {
                updateHeaderStats();
                renderDashboard();
                langToggle.textContent = state.uiLang === 'ru' ? '🌐 RU' : '🌐 EN';
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
